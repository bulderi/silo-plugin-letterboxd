name: Release

# Releases only from a tag pushed by hand, such as v0.3.1. The tag must match
# the version in manifest.json exactly; there is no automatic version bump.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: plugin-release
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GOWORK: off
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Check the tag against manifest.json
        run: |
          version="${GITHUB_REF_NAME#v}"
          manifest_version="$(jq -r '.version' manifest.json)"
          if [ "$version" != "$manifest_version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match manifest.json version ${manifest_version}."
            exit 1
          fi

      - name: Build every platform
        run: make build-all

      - name: Write checksums and the install index
        run: |
          (cd dist && sha256sum plugin-* > checksums.txt)
          go run ./cmd/genindex -repo "$GITHUB_REPOSITORY" -tag "$GITHUB_REF_NAME" \
            -dist dist -out dist/index.json

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/plugin-* dist/checksums.txt dist/index.json \
            --verify-tag --title "Letterboxd Watch Provider ${GITHUB_REF_NAME#v}" --generate-notes

  install-index:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main

      - name: Publish the released index on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          current="$(jq -r '.version' manifest.json)"
          if [ "$current" != "$version" ]; then
            echo "::notice::main has moved to version ${current}; the ${GITHUB_REF_NAME} index stays on the release."
            exit 0
          fi
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern index.json --dir "$RUNNER_TEMP/index"
          cp "$RUNNER_TEMP/index/index.json" index.json
          git add index.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: publish install index for ${GITHUB_REF_NAME}"
          git push origin HEAD:main
